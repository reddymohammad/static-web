<html>
    <head>
        <title> OTP Verfication</title>
    </head>
    <body>
        <form action="/otp ">
            <label > Mobile Number: </label>
            <input type="text" required placeholder="10 Digit  mobile number" pattern="[6-9][0-9]{9}"/><br><br>
            <label> vehicle Number </label>
            <input type="text" required placeholder="10 Digit vehicle number" pattern="^KA[0-9]{2}[A-Z]{2}[0-9{4}]"/>  <br><br>
            <button type="submit">Send OTP</button>
        </form>
    </body>

</html>
